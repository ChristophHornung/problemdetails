version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    ignore:
      # The analyzer is built against the oldest Roslyn it should run on, on purpose - see Directory.Packages.props.
      - dependency-name: "Microsoft.CodeAnalysis*"
    groups:
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore*"
      swashbuckle:
        patterns:
          - "Swashbuckle*"
      tunit:
        patterns:
          - "TUnit*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    groups:
      actions:
        patterns:
          - "*"
