name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore Chorn.AspNetCore.ProblemDetails.slnx
    - name: Build
      run: dotnet build Chorn.AspNetCore.ProblemDetails.slnx --no-restore --configuration Release
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release --project tests/Chorn.AspNetCore.ProblemDetails.Tests/Chorn.AspNetCore.ProblemDetails.Tests.csproj
    - name: Archive nuget-package artifact
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: ${{ github.workspace }}/src/*/bin/Release/*.nupkg
